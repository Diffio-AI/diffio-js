name: Publish JS SDK
run-name: >-
  Publish JS SDK${{ github.event_name == 'repository_dispatch' && format(' for API production {0}', github.event.client_payload.production_sha) || '' }}

on:
  repository_dispatch:
    types: [api-production-deployed]
  workflow_dispatch:
    inputs:
      production_sha:
        description: Production API commit that prompted this release
        required: false
        type: string

concurrency:
  group: publish-js-sdk
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@11.5.1

      - name: Install dependencies
        run: npm ci

      - name: Decide version
        id: version
        run: |
          current=$(node -p "require('./package.json').version")
          published=$(npm view diffio version 2>/dev/null || true)
          echo "current=$current"
          echo "published=$published"
          CURRENT="$current" PUBLISHED="$published" node - <<'NODE'
          const fs = require("fs");
          const current = process.env.CURRENT;
          const published = process.env.PUBLISHED;

          const parse = (value) => {
            const core = value.split("-")[0].split("+")[0];
            const parts = core.split(".").map((item) => parseInt(item, 10));
            while (parts.length < 3) {
              parts.push(0);
            }
            return parts.slice(0, 3);
          };

          const compare = (left, right) => {
            const a = parse(left);
            const b = parse(right);
            for (let i = 0; i < 3; i += 1) {
              if (a[i] > b[i]) return 1;
              if (a[i] < b[i]) return -1;
            }
            return 0;
          };

          const bumpPatch = (value) => {
            const [major, minor, patch] = parse(value);
            return `${major}.${minor}.${patch + 1}`;
          };

          let nextVersion = current;
          let bumpNeeded = false;
          if (published) {
            const comparison = compare(current, published);
            if (comparison <= 0) {
              nextVersion = bumpPatch(comparison === 0 ? current : published);
              bumpNeeded = true;
            }
          }

          const publish =
            !published || (published && compare(nextVersion, published) > 0);

          const output = process.env.GITHUB_OUTPUT;
          if (output) {
            fs.appendFileSync(output, `next_version=${nextVersion}\n`);
            fs.appendFileSync(
              output,
              `bump_needed=${bumpNeeded ? "true" : "false"}\n`
            );
            fs.appendFileSync(
              output,
              `publish=${publish ? "true" : "false"}\n`
            );
          }
          NODE

      - name: Check if exact version already exists
        id: check_exact
        env:
          NEXT_VERSION: ${{ steps.version.outputs.next_version }}
        run: |
          echo "Checking if diffio@$NEXT_VERSION already exists on npm..."
          if npm view "diffio@$NEXT_VERSION" version 2>/dev/null; then
            echo "Version $NEXT_VERSION already published - skipping"
            echo "already_published=true" >> "$GITHUB_OUTPUT"
          else
            echo "Version $NEXT_VERSION not found - will publish"
            echo "already_published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Bump package.json version
        if: ${{ steps.version.outputs.bump_needed == 'true' && steps.check_exact.outputs.already_published != 'true' }}
        run: npm version "${{ steps.version.outputs.next_version }}" --no-git-tag-version

      - name: Sync SDK version constant
        if: ${{ steps.check_exact.outputs.already_published != 'true' }}
        env:
          NEXT_VERSION: ${{ steps.version.outputs.next_version }}
        run: |
          node - <<'NODE'
          const fs = require("fs");
          const path = "src/version.ts";
          const nextVersion = process.env.NEXT_VERSION;
          if (!nextVersion) {
            process.exit(0);
          }
          const contents = fs.readFileSync(path, "utf8");
          const updated = contents.replace(
            /DIFFIO_SDK_VERSION\s*=\s*["'][^"']+["']/,
            `DIFFIO_SDK_VERSION = "${nextVersion}"`
          );
          if (updated !== contents) {
            fs.writeFileSync(path, updated);
          }
          NODE

      - name: Test
        if: ${{ steps.version.outputs.publish == 'true' && steps.check_exact.outputs.already_published != 'true' }}
        run: npm test

      - name: Build
        if: ${{ steps.version.outputs.publish == 'true' && steps.check_exact.outputs.already_published != 'true' }}
        run: npm run build

      - name: Publish to npm
        id: publish
        if: ${{ steps.version.outputs.publish == 'true' && steps.check_exact.outputs.already_published != 'true' }}
        env:
          NEXT_VERSION: ${{ steps.version.outputs.next_version }}
        run: |
          set -o pipefail
          if npm publish --access public 2>&1 | tee /tmp/npm-publish.log; then
            echo "Published successfully"
            echo "status=published" >> "$GITHUB_OUTPUT"
          else
            exit_code=$?
            if grep -qE 'E409|Cannot publish over previously' /tmp/npm-publish.log; then
              echo "Publish returned E409 - checking if version is live..."
              sleep 2
              if npm view "diffio@$NEXT_VERSION" version 2>/dev/null; then
                echo "Version $NEXT_VERSION confirmed live on npm - treating as success"
                echo "status=already_live" >> "$GITHUB_OUTPUT"
              else
                echo "E409 but version not found on npm - failing"
                exit $exit_code
              fi
            else
              exit $exit_code
            fi
          fi

      - name: Summary
        if: always()
        env:
          NEXT_VERSION: ${{ steps.version.outputs.next_version }}
          PUBLISH_NEEDED: ${{ steps.version.outputs.publish }}
          ALREADY_PUBLISHED: ${{ steps.check_exact.outputs.already_published }}
          PUBLISH_STATUS: ${{ steps.publish.outputs.status }}
        run: |
          echo "### Publish Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Target version**: $NEXT_VERSION" >> "$GITHUB_STEP_SUMMARY"
          if [[ "$ALREADY_PUBLISHED" == "true" ]]; then
            echo "- **Result**: Skipped (version already on npm)" >> "$GITHUB_STEP_SUMMARY"
          elif [[ "$PUBLISH_STATUS" == "already_live" ]]; then
            echo "- **Result**: Skipped (E409 race, version confirmed live)" >> "$GITHUB_STEP_SUMMARY"
          elif [[ "$PUBLISH_STATUS" == "published" ]]; then
            echo "- **Result**: Published successfully" >> "$GITHUB_STEP_SUMMARY"
          elif [[ "$PUBLISH_NEEDED" != "true" ]]; then
            echo "- **Result**: Skipped (no publish needed)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- **Result**: Unknown or failed" >> "$GITHUB_STEP_SUMMARY"
          fi
